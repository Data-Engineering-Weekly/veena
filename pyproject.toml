[project]
name = "veena"
version = "0.1.0"
description = "Self-organizing data stack: consumers declare outcomes, the engine maintains the asset graph."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ananth Packkildurai", email = "apackkildurai@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["data-engineering", "orchestration", "semantic-layer", "dbt", "duckdb", "snowflake", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.4",
    "pydantic>=2.11",
    "pytz>=2025.2",  # duckdb needs it to return TIMESTAMPTZ values to Python
    "pyyaml>=6.0",
    "sqlglot>=27.0",
    "typer>=0.17",
]

[project.optional-dependencies]
claude = ["anthropic>=1.11.0"]
postgres = ["psycopg[binary]>=3.2"]
all = ["anthropic>=1.11.0", "psycopg[binary]>=3.2"]

[project.scripts]
veena = "veena.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.13",
    "types-pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ananthdurai/veena"
Repository = "https://github.com/ananthdurai/veena"
Documentation = "https://github.com/ananthdurai/veena/blob/main/USAGE.md"
Changelog = "https://github.com/ananthdurai/veena/blob/main/CHANGELOG.md"
Issues = "https://github.com/ananthdurai/veena/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "fixtures/**", "prd/**", "USAGE.md", "DEVELOPERS.md", "AGENTS.md"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "D",                # pydocstyle
    "ANN",              # annotations
    "PTH",              # pathlib
    "RET",              # return
    "TCH",              # type-checking imports
]
ignore = [
    "D100", "D104",     # module/package docstrings are optional
    "D203", "D213",     # conflict with D211/D212
    "ANN401",           # Any is allowed where the payload is open-ended
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"src/veena/scenario/dbt_fixture.py" = ["E501"]  # a data file: model SQL and column maps

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::ResourceWarning"]
