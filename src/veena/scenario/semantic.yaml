# Approved meaning for the customer-spend scenario. People own this file; the engine reads it.
sources:
  - name: customers
    table: customers
    primary_key: [customer_id]
    columns: [customer_id, created_at, region]
  - name: accounts
    table: accounts
    primary_key: [account_id]
    columns: [account_id, opened_at]
  - name: identity_mappings
    table: identity_mappings
    primary_key: [mapping_id]
    columns: [mapping_id, account_id, customer_id, valid_from, valid_to]
  - name: purchases
    table: purchases
    primary_key: [purchase_id]
    columns: [purchase_id, account_id, purchased_at, amount_usd, status]
  - name: households_by_residence
    table: households_by_residence
    primary_key: [household_id, customer_id]
    columns: [household_id, customer_id]
  - name: households_by_billing
    table: households_by_billing
    primary_key: [household_id, customer_id]
    columns: [household_id, customer_id]

entities:
  - name: customer
    version: 1
    source: customers
    key: customer_id
    description: One row per registered customer, the individual account holder.
  - name: household_by_residence
    version: 1
    source: households_by_residence
    key: household_id
    description: Groups customers who share a primary residence address.
  - name: household_by_billing
    version: 1
    source: households_by_billing
    key: household_id
    description: Groups customers whose billing accounts are linked.

calculations:
  - name: purchase_amount_usd
    version: 4
    source: purchases
    expression: "CASE WHEN status = 'settled' THEN amount_usd ELSE 0 END"
    unit: USD
    description: Spend, spending, or total amount in USD from settled purchases. Refunded purchases contribute zero.
  - name: purchase_count
    version: 1
    source: purchases
    expression: "CASE WHEN status = 'settled' THEN 1 ELSE 0 END"
    unit: purchases
    description: Count, number, or how many settled purchases were made. Refunded purchases do not count.

time_rules:
  - name: purchase_date
    version: 1
    source: purchases
    timestamp_column: purchased_at
    timezone: UTC

identity_policies:
  - name: customer_identity_point_in_time
    version: 2
    entity: semantic:customer@1
    fact_source: purchases
    fact_key: account_id
    fact_timestamp: purchased_at
    mapping_source: identity_mappings
    mapping_fact_key: account_id
    mapping_entity_key: customer_id
    valid_from: valid_from
    valid_to: valid_to
    description: A purchase belongs to the customer who owned the account at purchase time.
